<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nexus Acadêmico - Sistema Completo</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card { border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 20px; border-radius: 10px; background: #fafafa; }
        h1, h2 { color: #2c3e50; }
        button { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219150; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        #chat-output { background: #fff; padding: 15px; margin-top: 10px; border-left: 5px solid #27ae60; min-height: 50px; }
        .stats { display: flex; gap: 20px; font-weight: bold; color: #34495e; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Nexus Acadêmico</h1>
    
    <div class="stats">
        <span>Nível: <span id="nivel">1</span></span>
        <span>XP: <span id="xp">0</span></span>
    </div>

    <div class="card">
        <h2>Nexus Mentor (IA)</h2>
        <textarea id="userInput" placeholder="O que deseja estudar hoje?"></textarea>
        <button onclick="falarComIA()">Perguntar ao Mentor</button>
        <div id="chat-output">O Mentor está pronto para guiar seus estudos...</div>
    </div>

    <div class="card">
        <h2>Descoberta de Carreira</h2>
        <p>Realize o teste de habilidades para desbloquear novas trilhas.</p>
        <button onclick="iniciarTeste()">Iniciar Teste de Perfil</button>
    </div>
</div>

<script>
    // Sua chave de API integrada
    const API_KEY = 'AIzaSyAF02V_iBJVxNuphYbIBCgN479yXp9lG3c'; 
    let xp = 0;
    let nivel = 1;

    async function falarComIA() {
        const pergunta = document.getElementById('userInput').value;
        const display = document.getElementById('chat-output');
        
        if (!pergunta) return;
        display.innerText = "Pensando...";

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;

        try {
            const resposta = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Você é o Nexus Mentor. Responda de forma motivadora: " + pergunta }] }]
                })
            });
            const dados = await resposta.json();
            const texto = dados.candidates[0].content.parts[0].text;
            display.innerText = texto;
            
            // Sistema de XP
            xp += 50;
            document.getElementById('xp').innerText = xp;
            if(xp >= 100) { nivel++; xp = 0; document.getElementById('nivel').innerText = nivel; }
        } catch (erro) {
            display.innerText = "Erro: Verifique a conexão.";
        }
    }

    function iniciarTeste() {
        alert("Iniciando jornada de descoberta de carreira...");
    }
</script>

</body>
</html>
